[project]
name = "claude-realms"
version = "0.1.0"
description = "Private Linux desktops for Claude Code: a labwc realm or an Omarchy VM per session"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "fastapi>=0.115",
    "uvicorn>=0.35.0",
    "websockets>=14",
    "psutil>=5.9",
    "numpy>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realms_core", "src/claude_realms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts real private desktops (run in the Docker rig)"]
addopts = "-m 'not integration'"
